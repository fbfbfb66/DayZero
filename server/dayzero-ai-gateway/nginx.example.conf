# Example Nginx reverse proxy for DayZero AI Gateway on Alibaba Cloud ECS.
# Place in /etc/nginx/sites-available/dayzero-ai-gateway and enable with:
#   ln -s /etc/nginx/sites-available/dayzero-ai-gateway /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx
#
# The following `limit_req_zone` MUST live in the http{} context (e.g. /etc/nginx/nginx.conf
# or a conf.d/*.conf include), not inside a server{} block. It defines a modest per-client
# rate limit for the authenticated AI endpoints. Tune the rate to your traffic.
#   limit_req_zone $binary_remote_addr zone=dayzero_aigw:10m rate=5r/s;

# Point this at the gateway container over the internal Docker network (recommended):
upstream dayzero_ai_gateway {
    # When Nginx runs as a container on the `dayzero-net` network defined in docker-compose.yml:
    server dayzero-ai-gateway:8080;
    # When Nginx runs on the host and the gateway publishes to loopback only
    # (ports: "127.0.0.1:8080:8080"), use this instead:
    #   server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai-gateway.example.com;

    # Redirect HTTP to HTTPS in production.
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai-gateway.example.com;

    # Replace with real certificates (e.g. from Alibaba Cloud SSL or Let's Encrypt).
    ssl_certificate /etc/nginx/ssl/dayzero-ai-gateway.crt;
    ssl_certificate_key /etc/nginx/ssl/dayzero-ai-gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    location / {
        # Modest rate limit (burst absorbs short spikes, nodelay keeps latency low).
        # Requires the `limit_req_zone` declared in the http{} context (see header above).
        limit_req zone=dayzero_aigw burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://dayzero_ai_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # SSE streaming support: never buffer or cache streamed responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
